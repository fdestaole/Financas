services:
  postgres:
    image: postgres:16-alpine
    container_name: financas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
      POSTGRES_DB: financas
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: financas-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  api:
    build: ./apps/api
    container_name: financas-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://financas:financas@postgres:5432/financas
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGINS: http://localhost:5173
      TZ: America/Sao_Paulo
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    container_name: financas-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3333/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
